services:
  - type: web
    name: sthree-vastras-admin
    runtime: node
    plan: free
    rootDir: admin-prototype
    buildCommand: echo "No dependencies to install"
    startCommand: node server.js
    healthCheckPath: /health
    autoDeployTrigger: off
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEMO_MODE
        value: "true"
      - key: DEMO_ADMIN_EMAIL
        sync: false
      - key: DEMO_ADMIN_PASSWORD
        sync: false
